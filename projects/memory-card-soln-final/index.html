<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding for emoji/special characters -->
    <meta charset="UTF-8">
    <!-- Makes layout responsive on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser tab title -->
    <title>Memory Card Game</title>
    <!-- Link external stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Main wrapper that contains the full game UI -->
    <div class="container">
        <!-- Title area -->
        <header>
            <h1>Memory Card Game</h1>
            <p class="subtitle">Match card pairs to win!</p>
        </header>

        <!-- Main game content -->
        <main>
            <!-- Status bar: move counter + guidance/win message -->
            <section class="game-status">
                <div class="status-item">
                    <span class="label">Moves:</span>
                    <!-- JS updates this value after every turn -->
                    <span id="moves-count" class="value">0</span>
                </div>
                <div class="status-item">
                    <!-- JS updates this text during gameplay -->
                    <span id="game-message" class="message">Click a card to start!</span>
                </div>
            </section>

            <!-- Empty board; cards are generated by JavaScript -->
            <section class="game-board" id="game-board">
                <!-- Render target for dynamic card elements -->
            </section>

            <!-- Controls -->
            <section class="game-controls">
                <!-- Starts a brand new shuffled game -->
                <button id="reset-btn" class="reset-button">Reset</button>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>Good luck matching!</p>
        </footer>
    </div>

    <!-- Load game logic after HTML is parsed -->
    <script src="scripto.js"></script>
</body>

</html>
